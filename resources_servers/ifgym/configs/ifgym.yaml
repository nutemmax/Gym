ifgym_resources_server:
  resources_servers:
    ifgym:
      entrypoint: app.py
      domain: instruction_following
      verified: false
      allowed_agents: [ifgym_agent]
      description: Multi-turn instruction following with deterministic per-turn rewards
ifgym_agent:
  responses_api_agents:
    ifgym_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: ifgym_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      max_steps: 10
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/ifgym/data/example.jsonl
ifgym_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: ifgym_agent
